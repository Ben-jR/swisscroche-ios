name: Bug Report
about: Report unexpected or broken behavior
title: ""
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What is happening?
    validations:
      required: true

  - type: input
    id: ios-version
    attributes:
      label: iOS version
      placeholder: e.g. iOS 17.4

  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: e.g. 1.2.0

