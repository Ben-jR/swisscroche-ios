name: Bug Report
about: Report unexpected or broken behavior
title: "[Bug] "
labels:
  - bug
body:
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched existing issues and this has not been reported yet
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What is happening?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: ios-version
    attributes:
      label: iOS version
      placeholder: e.g. iOS 17.4

  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: e.g. 1.2.0

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, logs, or any other relevant information.
