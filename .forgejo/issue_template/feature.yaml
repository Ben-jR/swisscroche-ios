name: Feature Request
about: Suggest a new feature or improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched existing issues and this has not been requested yet
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem this feature solves
      description: Is your feature request related to a problem? Describe it.
      placeholder: I'm frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you have considered.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, screenshots, or any other relevant information.
